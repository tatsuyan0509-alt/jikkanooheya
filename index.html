<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ただいま整理</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #2b2b2b; --sub: #6b6b6b; --line: #e3dfd6;
    --keep: #2e7d5b; --give: #c27c0e; --sell: #2f6db5; --toss: #b23b3b; --photo: #7a4fb0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 18px; line-height: 1.5; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 22px; }
  #progress { color: var(--sub); font-size: 15px; margin-top: 2px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--keep); width: 0; transition: width .3s; }
  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tabs button { flex: 1; font-size: 16px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { padding: 12px 16px 80px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card img { display: block; width: 100%; max-height: 70vw; object-fit: contain; background: #eeeae2; }
  .body { padding: 12px 14px 14px; }
  .meta { color: var(--sub); font-size: 14px; }
  .memo { font-size: 20px; font-weight: 600; margin: 4px 0 2px; }
  .memo.none { color: var(--sub); font-weight: 400; font-size: 16px; }
  .due { font-size: 14px; color: var(--sub); }
  .due.late { color: var(--toss); font-weight: 600; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .choices button { min-height: 52px; font-size: 18px; border-radius: 12px; background: #fff;
    border: 2px solid currentColor; font-weight: 600; }
  .choices button.wide { grid-column: span 2; }
  .choices button.on { color: #fff !important; }
  .keep { color: var(--keep); } .keep.on { background: var(--keep); border-color: var(--keep); }
  .give { color: var(--give); } .give.on { background: var(--give); border-color: var(--give); }
  .sell { color: var(--sell); } .sell.on { background: var(--sell); border-color: var(--sell); }
  .toss { color: var(--toss); } .toss.on { background: var(--toss); border-color: var(--toss); }
  .photo { color: var(--photo); } .photo.on { background: var(--photo); border-color: var(--photo); }
  .decided { margin-top: 8px; font-size: 14px; color: var(--sub); }
  .msg { text-align: center; color: var(--sub); padding: 40px 8px; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>ただいま整理</h1>
  <div id="progress">読み込み中…</div>
  <div class="bar"><div id="barFill"></div></div>
  <div class="tabs">
    <button data-f="todo" class="on">まだ決めていない</button>
    <button data-f="all">すべて</button>
  </div>
</header>
<main id="list"><p class="msg">読み込み中…</p></main>
<div id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== ここだけ設定 =====
const LIFF_ID = '2011850066-HXKrjld3';
const GAS_URL = 'ここにApps ScriptのウェブアプリURLを貼る';
// =======================

const CHOICES = [
  { v: '残す', c: 'keep' }, { v: '譲る', c: 'give' },
  { v: '売る', c: 'sell' }, { v: '捨てる', c: 'toss' },
  { v: '写真で残す', c: 'photo', wide: true },
];
let items = [], filter = 'todo', fid = '', me = '';
const recent = new Set(); // 「まだ決めていない」で、決めた直後のものは消さずに残す

function esc(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2200);
}
function today() { const d = new Date(); return (d.getMonth() + 1) + '/' + d.getDate(); }

async function api(body) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({}, body, { idToken: liff.getIDToken(), f: fid })),
  });
  const d = await res.json();
  if (!d.ok) throw new Error(d.error || 'エラーが起きました');
  return d;
}

function render() {
  const done = items.filter(i => i.decision).length;
  document.getElementById('progress').textContent =
    items.length ? `全${items.length}点のうち ${done}点 決定済み` : 'まだ写真がありません';
  document.getElementById('barFill').style.width = items.length ? (done / items.length * 100) + '%' : '0';

  const shown = filter === 'all' ? items : items.filter(i => !i.decision || recent.has(i.id));
  const list = document.getElementById('list');
  if (!shown.length) {
    list.innerHTML = `<p class="msg">${items.length ? 'すべて決まりました。おつかれさまでした。' : 'LINEに写真を送ると、ここに並びます。'}</p>`;
    return;
  }

  const now = Date.now();
  list.innerHTML = shown.map(i => {
    let due = '';
    if (!i.decision && i.deadline) {
      const days = Math.ceil((i.deadline - now) / 86400000);
      due = days > 0 ? `<div class="due">返事の期限まで あと${days}日</div>`
                     : `<div class="due late">返事の期限を過ぎています</div>`;
    }
    const btns = CHOICES.map(c =>
      `<button class="${c.c}${c.wide ? ' wide' : ''}${i.decision === c.v ? ' on' : ''}" data-id="${i.id}" data-v="${c.v}">${c.v}</button>`
    ).join('');
    const decided = i.decision ? `<div class="decided">${esc(i.decidedBy || '')}さんが決定（${esc(i.decidedAt || '')}）</div>` : '';
    return `<article class="card">
      <img loading="lazy" src="${esc(i.img)}" alt="No.${i.id}">
      <div class="body">
        <div class="meta">No.${i.id}　${esc(i.created)} ${esc(i.by)}さんが登録</div>
        <div class="memo${i.memo ? '' : ' none'}">${i.memo ? esc(i.memo) : '（メモなし）'}</div>
        ${due}
        <div class="choices">${btns}</div>
        ${decided}
      </div>
    </article>`;
  }).join('');
}

async function decide(id, v) {
  const it = items.find(i => String(i.id) === String(id));
  if (!it) return;
  const before = { decision: it.decision, decidedBy: it.decidedBy, decidedAt: it.decidedAt };
  const next = it.decision === v ? '' : v; // 同じボタンをもう一度押すと取り消し
  Object.assign(it, { decision: next, decidedBy: next ? me : '', decidedAt: next ? today() : '' });
  recent.add(it.id);
  render();
  try {
    await api({ action: 'decide', id: it.id, decision: next });
    toast(next ? `No.${it.id} を「${next}」にしました` : `No.${it.id} を取り消しました`);
  } catch (e) {
    Object.assign(it, before);
    render();
    toast('保存できませんでした：' + e.message);
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('.choices button');
  if (b) { decide(b.dataset.id, b.dataset.v); return; }
  const t = e.target.closest('.tabs button');
  if (t) {
    filter = t.dataset.f; recent.clear();
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === t));
    render(); window.scrollTo(0, 0);
  }
});

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    fid = new URLSearchParams(location.search).get('f') || '';
    if (!fid) { const p = liff.getDecodedIDToken(); fid = p ? p.sub : ''; } // 1対1トーク用
    const d = await api({ action: 'list' });
    items = d.items; me = d.me;
    render();
  } catch (e) {
    document.getElementById('progress').textContent = '';
    document.getElementById('list').innerHTML = `<p class="msg">うまく開けませんでした。<br>${esc(e.message)}</p>`;
  }
}
main();
</script>
</body>
</html>
